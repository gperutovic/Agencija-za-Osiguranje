<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b1a"/>
      <stop offset="50%" stop-color="#fb6504"/>
      <stop offset="100%" stop-color="#d44800"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Protective Hexagon Shield with Hairline Border -->
  <polygon points="32,4 56,16 56,44 32,58 8,44 8,16" fill="url(#shieldBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <polygon points="32,7 53,18 53,42 32,55 11,42 11,18" fill="none" stroke="#fb6504" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Stylized Monogram Ž & Life-Leaf Crest in Electric Orange -->
  <!-- Upper Chevron of Ž -->
  <path d="M22 20H42L36 26H22Z" fill="url(#orangeGlow)"/>
  
  <!-- Central Dynamic Diagonal Slash / Sprout -->
  <path d="M37 26L23 42H31L43 28L37 26Z" fill="url(#orangeGlow)"/>
  
  <!-- Lower Base of Ž -->
  <path d="M21 42H41L37 46H21V42Z" fill="url(#orangeGlow)"/>

  <!-- Organic Diacritic Caron (Kvačica na Ž) styled as Life Sprout Leaf -->
  <path d="M32 12C33.5 14 36 15 38 15C36 17 33.5 17 32 15.5C30.5 17 28 17 26 15C28 15 30.5 14 32 12Z" fill="#ff9142"/>
  
  <!-- Safety Core Dot -->
  <circle cx="32" cy="33" r="2.5" fill="#10B981" filter="url(#glowFilter)"/>
</svg>
