<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Teal Primary Gradient -->
    <linearGradient id="shieldTealGrad" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0D9488" />
      <stop offset="60%" stopColor="#0F766E" />
      <stop offset="100%" stopColor="#115E59" />
    </linearGradient>

    <!-- Azure Innovation Accent Gradient -->
    <linearGradient id="azureGlowGrad" x1="30" y1="15" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0EA5E9" />
    </linearGradient>

    <!-- Warm Gold Key & Security Accent -->
    <linearGradient id="goldKeyGrad" x1="45" y1="35" x2="75" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F766E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Protective Shield Silhouette -->
  <path
    d="M60 8 C88 8 108 24 108 52 C108 82 82 104 60 114 C38 104 12 82 12 52 C12 24 32 8 60 8 Z"
    fill="url(#shieldTealGrad)"
    filter="url(#softGlow)"
  />

  <!-- Subtle Inner Shield Trim Line -->
  <path
    d="M60 16 C82 16 98 29 98 52 C98 76 76 95 60 103 C44 95 22 76 22 52 C22 29 38 16 60 16 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-opacity="0.2"
  />

  <!-- Stylized Geometric "A" Architecture (The Shield Crossbeams) -->
  <!-- Left Pillar of 'A' -->
  <path
    d="M60 22 L36 78 H48 L56 58 H64 L72 78 H84 L60 22 Z"
    fill="url(#azureGlowGrad)"
    opacity="0.95"
  />

  <!-- Apex Keyhole Opening (Negative Space & Key Bow) -->
  <path
    d="M60 36 L54 52 H66 L60 36 Z"
    fill="#0F766E"
  />

  <!-- Integrated Subtle Key Mechanism (Unlocking Protection) -->
  <!-- Circular Key Bow Head -->
  <circle cx="60" cy="56" r="6.5" fill="url(#goldKeyGrad)" />
  <circle cx="60" cy="56" r="3" fill="#0F766E" />

  <!-- Key Shaft Downward through the Base of 'A' -->
  <rect x="58.5" y="62" width="3" height="22" rx="1.5" fill="url(#goldKeyGrad)" />

  <!-- Key Bits / Teeth (Unlocking safety notch) -->
  <rect x="61.5" y="74" width="5.5" height="3" rx="1" fill="url(#goldKeyGrad)" />
  <rect x="61.5" y="80" width="4" height="2.5" rx="0.8" fill="url(#goldKeyGrad)" />
</svg>
